<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Favicons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Viewport -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO -->
    <title>Modern Dresses | Fashion for Every Generation</title>
    <meta
      name="description"
      content="Discover premium ethnic wear, frocks, kurtis, party wear, shirts and clothing for boys, girls, women and men at Modern Dresses."
    />

    <!-- =====================================================
         PWA MANIFEST
         Customer: /manifest.webmanifest
         Admin:    /admin-manifest.webmanifest
    ====================================================== -->

    <link
      id="pwa-manifest"
      rel="manifest"
      href="/manifest.webmanifest"
    />

    <script>
      (function () {
        const isAdmin =
          window.location.pathname === "/admin" ||
          window.location.pathname.startsWith("/admin/");

        if (isAdmin) {
          const manifest = document.getElementById("pwa-manifest");

          if (manifest) {
            manifest.setAttribute(
              "href",
              "/admin-manifest.webmanifest"
            );
          }

          document.title = "Admin Panel | Modern Dresses";
        }
      })();
    </script>

    <!-- PWA Theme -->
    <meta name="theme-color" content="#1C1917" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Apple PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="default"
    />

    <meta
      id="apple-pwa-title"
      name="apple-mobile-web-app-title"
      content="Modern Dresses"
    />
<!--ggg -->
    <!-- Change Apple PWA name for Admin -->
    <script>
      (function () {
        const isAdmin =
          window.location.pathname === "/admin" ||
          window.location.pathname.startsWith("/admin/");

        if (isAdmin) {
          const appleTitle =
            document.getElementById("apple-pwa-title");

          if (appleTitle) {
            appleTitle.setAttribute("content", "Admin Panel");
          }
        }
      })();
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>

  <body
    class="bg-boutique-50 text-charcoal font-sans antialiased selection:bg-boutique-300 selection:text-charcoal min-h-screen"
  >
    <div id="root"></div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
